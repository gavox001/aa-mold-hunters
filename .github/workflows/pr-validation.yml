name: PR Validation

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.8.0'

jobs:
  check-branch:
    name: Check Branch Source
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - name: Validate PR source
        run: |
          if [[ "${{ github.head_ref }}" != "dev" && "${{ github.head_ref }}" != "hotfix/"* && "${{ github.head_ref }}" != "release/"* ]]; then
            echo "::error::Only 'dev', 'hotfix/*', or 'release/*' branches can merge into 'main'"
            exit 1
          fi
          echo "Branch validation passed: ${{ github.head_ref }} -> ${{ github.base_ref }}"

  check-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/database/**'
              - 'packages/eslint-config/**'
              - 'packages/typescript-config/**'
            web:
              - 'apps/web/**'
              - 'apps/web4/**'
              - 'packages/ui/**'
              - 'packages/eslint-config/**'
              - 'packages/tailwind-config/**'
              - 'packages/typescript-config/**'
            packages:
              - 'packages/**'

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [check-changes]
    if: needs.check-changes.outputs.api == 'true' || needs.check-changes.outputs.web == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aamold_hunter_db?schema=public
          JWT_SECRET: test-secret
          NEXTAUTH_SECRET: test-nextauth-secret
          NEXTAUTH_URL: http://localhost:3000

  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Type check
        run: pnpm type-check
